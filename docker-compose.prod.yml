services:
  web:
    command: gunicorn moto_config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    # --workers 3 — три процесса Gunicorn обрабатывают запросы параллельно.
    # Это и есть та ситуация, о которой мы говорили с кэшем в Redis —
    # у каждого воркера своя память, поэтому кэш ОБЯЗАН быть в Redis,
    # а не в памяти процесса, иначе воркеры будут "не видеть" друг друга
    volumes: []
    # в проде НЕ мапим локальную папку внутрь контейнера — код должен
    # быть "запечён" в образ при сборке, а не редактироваться на лету
    environment:
      - DEBUG=False